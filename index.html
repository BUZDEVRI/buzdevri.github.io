<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomatik Eşleşmeli 2D Parkur</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
            border: 3px solid #38bdf8;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* EŞLEŞTİRME EKRANI */
        #matchmaking-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 30px 40px;
            border-radius: 16px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 380px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
            background: #22c55e;
        }

        .btn:hover { background: #16a34a; }

        #status-txt {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #38bdf8;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: #38bdf8;
            z-index: 90;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="status-txt">Durum: Bağlantı Bekleniyor...</div>

        <!-- Kodsuz Otomatik Eşleşme Paneli -->
        <div id="matchmaking-panel">
            <h2 style="color: #38bdf8;">PARKOUR RIVAL</h2>
            <p style="font-size: 13px; color: #94a3b8;">Arkadaşınla aynı anda butona basarak otomatik eşleşebilirsin!</p>
            <button class="btn" onclick="startMatchmaking()">🎲 Oyuncu / Rakip Bul</button>
        </div>

        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Sabit ortak eşleşme havuzu ID'si (Arkadaşınla aynı anda basarsan bu ID üzerinden buluşursunuz)
        const GLOBAL_POOL_ID = "parkour-global-matchmaking-room-v1";
        
        let peer = null;
        let conn = null;
        let isHost = false;

        function startMatchmaking() {
            document.getElementById("status-txt").innerText = "Durum: Rakip aranıyor...";
            document.querySelector(".btn").innerText = "Aranıyor...";
            document.querySelector(".btn").style.opacity = "0.6";
            document.querySelector(".btn").style.pointerEvents = "none";

            // Önce sunucuda bu ID'yi alan biri var mı diye bağlanmayı deneriz (Eğer varsa o hosttur, biz katılırız)
            peer = new Peer();

            peer.on('open', myId => {
                const testConn = peer.connect(GLOBAL_POOL_ID);

                testConn.on('open', () => {
                    // Bağlantı başarılı olduysa oda zaten doludur/kurulmuştur, direkt bağlanırız
                    conn = testConn;
                    setupConnection();
                    document.getElementById("status-txt").innerText = "Durum: Rakip bulundu, maç başlıyor! 🚀";
                });

                // Eğer bağlanamazsak (Oda boşsa), bu ID'yi alarak odayı biz kurarız (Host oluruz)
                setTimeout(() => {
                    if (!conn) {
                        peer.destroy();
                        
                        // Odayı kurmak için özel ID ile tekrar başlatıyoruz
                        peer = new Peer(GLOBAL_POOL_ID);

                        peer.on('open', () => {
                            isHost = true;
                            document.getElementById("status-txt").innerText = "Durum: Oda kuruldu, arkadaşın bekleniyor...";
                        });

                        peer.on('connection', incomingConn => {
                            conn = incomingConn;
                            setupConnection();
                            document.getElementById("status-txt").innerText = "Durum: Rakip bağlandı, maç başladı! 🚀";
                        });
                    }
                }, 1200);
            });
        }

        function setupConnection() {
            document.getElementById("matchmaking-panel").style.display = "none";

            conn.on('data', data => {
                if (data.type === 'POS') {
                    remotePlayer.x = data.x;
                    remotePlayer.y = data.y;
                }
            });

            conn.on('close', () => {
                alert("Rakip bağlantıyı kesti!");
                location.reload();
            });
        }

        // OYUN MOTORU & FİZİK
        const localPlayer = { x: 100, y: 400, vx: 0, vy: 0, radius: 20, isGrounded: false };
        const remotePlayer = { x: 100, y: 400, radius: 20 };
        const keys = {};
        const FINISH_X = 3500;

        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        function update() {
            if (keys["a"] || keys["arrowleft"]) localPlayer.vx = -7;
            else if (keys["d"] || keys["arrowright"]) localPlayer.vx = 7;
            else localPlayer.vx *= 0.8;

            if ((keys["w"] || keys[" "] || keys["arrowup"]) && localPlayer.isGrounded) {
                localPlayer.vy = -16;
                localPlayer.isGrounded = false;
            }

            localPlayer.vy += 0.8;
            localPlayer.x += localPlayer.vx;
            localPlayer.y += localPlayer.vy;

            const groundY = 520 - Math.sin(localPlayer.x * 0.004) * 60;
            if (localPlayer.y + localPlayer.radius >= groundY) {
                localPlayer.y = groundY - localPlayer.radius;
                localPlayer.vy = 0;
                localPlayer.isGrounded = true;
            }

            if (localPlayer.x >= FINISH_X) {
                alert("KAZANDIN! 🏆 Bitiş çizgisine ilk ulaştın!");
                localPlayer.x = 100;
            }

            if (conn && conn.open) {
                conn.send({ type: 'POS', x: localPlayer.x, y: localPlayer.y });
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cameraX = localPlayer.x - 300;

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Arka Plan
            ctx.fillStyle = "#0284c7";
            ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

            // Parkur Zemini
            ctx.fillStyle = "#22c55e";
            ctx.beginPath();
            ctx.moveTo(cameraX - 100, canvas.height);
            for (let x = cameraX - 100; x < cameraX + canvas.width + 100; x += 15) {
                let y = 520 - Math.sin(x * 0.004) * 60;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(cameraX + canvas.width + 100, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Bitiş Çizgisi
            ctx.fillStyle = "#facc15";
            ctx.fillRect(FINISH_X, 200, 15, 350);

            // Rakip
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(remotePlayer.x, remotePlayer.y, remotePlayer.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = "12px Arial";
            ctx.fillText("Rakip", remotePlayer.x - 15, remotePlayer.y - 25);

            // Sen
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(localPlayer.x, localPlayer.y, localPlayer.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = "12px Arial";
            ctx.fillText("Sen", localPlayer.x - 10, localPlayer.y - 25);

            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
