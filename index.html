<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyveleri Birleştir</title>
    <!-- Socket.io İstemci Kütüphanesi -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .pencere {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
        }
        button {
            cursor: pointer;
            border: none;
            font-weight: bold;
            border-radius: 90px;
            padding: 12px 20px;
            font-size: 18px;
            width: 100%;
            margin-top: 10px;
        }
        #oyna-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        #durum-mesaji {
            color: #f1c40f;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <!-- 1. ANA MENÜ PENCERESİ -->
    <div id="menu-penceresi" class="pencere">
        <div class="baslik-ana" style="text-align: center; margin-bottom: 20px;">
            <h1>Meyveleri Birleştir</h1>
            <p style="color: #aaa; font-size: 14px;">Çok Oyunculu Eşleşme</p>
        </div>

        <!-- Oyuna Başla Butonu -->
        <button id="oyna-btn">Oyuna Başla</button>
        <div id="durum-mesaji"></div>

        <!-- Mağaza Butonu -->
        <button type="button" onclick="alert('Mağaza yakında!')" style="background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; margin-top: 15px;">
            🛒 Mağaza
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Sunucu bağlantısını başlat
            const socket = io();

            const oynaButonu = document.getElementById('oyna-btn');
            const durumMesaji = document.getElementById('durum-mesaji');

            if (oynaButonu) {
                oynaButonu.addEventListener('click', () => {
                    console.log("Oyuna Başla butonuna tıklandı!");
                    
                    if (durumMesaji) {
                        durumMesaji.innerText = "Rakip aranıyor, lütfen bekleyin...";
                    }
                    
                    oynaButonu.disabled = true; // Tekrar basılmasını engelle

                    // Sunucuya rakip arama sinyali gönder
                    socket.emit('rakipAra');
                });
            }

            // Sunucudan "bekle" sinyali gelirse
            socket.on('bekle', (mesaj) => {
                if (durumMesaji) {
                    durumMesaji.innerText = mesaj;
                }
            });

            // Sunucudan "oyunBasliyor" sinyali gelirse
            socket.on('oyunBasliyor', (veri) => {
                if (durumMesaji) {
                    durumMesaji.innerText = "Rakip bulundu! Oyun başlıyor...";
                }
                console.log("Eşleşme sağlandı! Rakip ID:", veri.rakip);
            });
        });
    </script>
</body>
</html>
