    <script>
      document.addEventListener("DOMContentLoaded", () => {
    // 1. Socket bağlantısı (Alan adınla uyumlu)
    const socket = io({
        transports: ['websocket', 'polling']
    });

    const oynaButonu = document.getElementById('oyna-btn');
    const durumMesaji = document.getElementById('durum-mesaji');

    if (oynaButonu) {
        oynaButonu.addEventListener('click', async () => {
            console.log("Oyuna Başla butonuna tıklandı!");
            
            if (durumMesaji) {
                durumMesaji.innerText = "Mikrofon izni isteniyor...";
            }

            // 2. Mikrofon izni isteyelim
            let izinVerildi = false;
            try {
                const yerelSesAkisi = await navigator.mediaDevices.getUserMedia({ audio: true });
                window.oyuncuSesAkisi = yerelSesAkisi;
                izinVerildi = true;
                console.log("🎤 Mikrofon izni başarıyla verildi!");
            } catch (hata) {
                console.error("Mikrofon izni alınamadı:", hata);
                alert("Sesli sohbet için mikrofon iznine ihtiyaç var.");
            }
            
            if (!izinVerildi) {
                if (durumMesaji) durumMesaji.innerText = "Mikrofon izni verilmediği için başlatılamadı.";
                return;
            }

            if (durumMesaji) {
                durumMesaji.innerText = "Rakip aranıyor, lütfen bekleyin...";
            }
            
            oynaButonu.disabled = true; // Tekrar basılmasını engelle

            // 3. Sunucuya rakip arama sinyali gönder
            socket.emit('rakipAra');
        });
    }

    // Sunucudan "bekle" sinyali gelirse
    socket.on('bekle', (mesaj) => {
        if (durumMesaji) {
            durumMesaji.innerText = mesaj;
        }
    });

    // Sunucudan "oyunBasliyor" sinyali gelirse
    socket.on('oyunBasliyor', (veri) => {
        if (durumMesaji) {
            durumMesaji.innerText = "Rakip bulundu! Oyun başlıyor...";
        }
        console.log("Eşleşme sağlandı! Rakip ID:", veri.rakip);
    });
});


// Meyve sembolleri havuzu
const sembollerHavuzu = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍑', '🍍'];

// 4 Kişilik Oyun Tahtalarını Oluşturan Fonksiyon
function cokKisitliOyunuBaslat(veri) {
    // 1. Menüyü gizle, 4 kişilik oyun alanını aç
    const menuPenceresi = document.getElementById('menu-penceresi');
    const cokOyunculuAlan = document.getElementById('cok-oyunculu-alan');
    
    if (menuPenceresi) menuPenceresi.style.display = 'none';
    if (cokOyunculuAlan) cokOyunculuAlan.style.display = 'grid';

    // 2. 4 köşe için tahtaları doldur
    for (let oID = 0; oID < 4; oID++) {
        let tahtaEl = document.getElementById(`tahta-${oID}`);
        if (!tahtaEl) continue;
        
        tahtaEl.innerHTML = '';
        
        // Her oyuncu için 6 çift (12 kutu) meyve oluşturalım
        let secilenler = sembollerHavuzu.slice(0, 6);
        let ciftler = [...secilenler, ...secilenler];
        
        // Kartları karıştır (Fisher-Yates)
        for (let i = ciftler.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            let temp = ciftler[i];
            ciftler[i] = ciftler[j];
            ciftler[j] = temp;
        }

        // Kutuları ekrana bas
        for (let i = 0; i < ciftler.length; i++) {
            let kutu = document.createElement('div');
            kutu.className = 'mini-kutu';
            kutu.dataset.oyuncu = oID;
            kutu.dataset.index = i;
            kutu.innerText = '?'; // Kapalı başlasın
            kutu.dataset.meyve = ciftler[i]; // Gerçek meyve arkasında saklı
            
            // Sadece kendi köşemizdeki kutulara tıklanabilsin (0 numaralı köşe Sen'in)
            if (oID === 0) {
                kutu.onclick = () => {
                    kutu.innerText = kutu.dataset.meyve; // Tıklayınca açlsın
                };
            }
            
            tahtaEl.appendChild(kutu);
        }
    }
}

// Sayfa yüklendiğinde çalışacak ana blok
document.addEventListener('DOMContentLoaded', () => {
    // Socket bağlantısının aktif olduğundan emin olalım
    const socket = typeof io !== 'undefined' ? io() : null;

    const oynaButonu = document.getElementById('oyna-btn');
    const durumMesaji = document.getElementById('durum-mesaji');

    if (!oynaButonu) {
        console.error("HATA: 'oyna-btn' ID'li buton bulunamadı!");
        return;
    }

    // Butona tıklandığında çalışacak olay
    oynaButonu.addEventListener('click', () => {
        console.log("🟢 Oyuna Başla butonuna tıklandı!");
        
        if (durumMesaji) {
            durumMesaji.innerText = "Rakip aranıyor, lütfen bekleyin...";
        }
        
        oynaButonu.disabled = true;

        if (socket) {
            socket.emit('rakipAra');
            console.log("📤 Sunucuya 'rakipAra' sinyali gönderildi.");
        } else {
            console.error("HATA: socket nesnesi tanımlı değil!");
        }
    });

    if (socket) {
        // Sunucudan "bekle" mesajı gelirse
        socket.on('bekle', (mesaj) => {
            if (durumMesaji) {
                durumMesaji.innerText = mesaj;
            }
        });

        // Sunucudan "oyun başlıyor" sinyali gelirse
        socket.on('oyunBasliyor', (veri) => {
            console.log("Rakip bulundu, oyun başlatılıyor!", veri);
            if (durumMesaji) {
                durumMesaji.innerText = "Rakip bulundu! Oyun başlıyor...";
            }
            cokKisitliOyunuBaslat(veri);
        });
    }
});

// Pencere açma/kapatma yardımcı fonksiyonları
function pencereAc(pencereId) {
    const pencere = document.getElementById(pencereId);
    if (pencere) pencere.style.display = 'block';
}

function pencereKapat(pencereId) {
    const pencere = document.getElementById(pencereId);
    if (pencere) pencere.style.display = 'none';
}

// Telefondan seçilen fotoğrafı önizlemeye yükleme
let kullaniciAvatarVerisi = null;

function fotografiYukle(event) {
    const dosya = event.target.files[0];
    if (dosya) {
        const okuyucu = new FileReader();
        okuyucu.onload = function(e) {
            kullaniciAvatarVerisi = e.target.result;
            const alan = document.getElementById('profil-emoji-veya-foto');
            if (alan) {
                // Emoji yerine seçilen resmi koyalım
                alan.innerHTML = `<img src="${kullaniciAvatarVerisi}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
            
            // Ana menüdeki avatarı da güncelleyelim
            const anaAvatar = document.getElementById('ana-profil-avatar');
            if (anaAvatar) {
                anaAvatar.innerHTML = `<img src="${kullaniciAvatarVerisi}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
        };
        okuyucu.readAsDataURL(dosya);
    }
}

// Profil bilgilerini kaydetme
function profiliKaydet() {
    const isimInput = document.getElementById('kullanici-adi-input');
    const yeniIsim = isimInput ? isimInput.value : "Oyuncu";
    
    // Bilgileri tarayıcı hafızasında saklayalım
    localStorage.setItem('kullaniciAdi', yeniIsim);
    if (kullaniciAvatarVerisi) {
        localStorage.setItem('kullaniciAvatar', kullaniciAvatarVerisi);
    }
    
    alert("Profil başarıyla kaydedildi!");
    pencereKapat('profil-penceresi');
}
// Mikrofon izni isteme ve ses akışını başlatma fonksiyonu
async function mikrofonIzniIste() {
    try {
        // Tarayıcı otomatik olarak telefonda, tablette veya PC'de izin penceresi açar
        const yerelSesAkisi = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        console.log("🎤 Mikrofon izni başarıyla verildi!");
        
        // Bu ses akışını ileride diğer oyunculara aktarmak üzere saklıyoruz
        window.oyuncuSesAkisi = yerelSesAkisi;
        
        return true;
    } catch (hata) {
        console.error("Mikrofon izni alınamadı:", hata);
        alert("Sesli sohbet için mikrofon iznine ihtiyaç var. Lütfen tarayıcı ayarlarından izin verin.");
        return false;
    }
}
// Güncellenmiş Buton ve Mikrofon Başlatma Mantığı
document.addEventListener("DOMContentLoaded", () => {
    const socket = io();

    const oynaButonu = document.getElementById('oyna-btn');
    const durumMesaji = document.getElementById('durum-mesaji');

    if (oynaButonu) {
        oynaButonu.addEventListener('click', async () => {
            console.log("Oyuna Başla butonuna tıklandı!");
            
            if (durumMesaji) {

            // 1. Önce telefondan/tabletten/PC'den mikrofon izni isteyelim

                durumMesaji.innerText = "Rakip aranıyor ve ses kanalı açılıyor...";
            }
            
            oynaButonu.disabled = true; // Tekrar basılmasını engelle

            // 2. Sunucuya rakip arama sinyali gönder
            socket.emit('rakipAra');
        });
    }

    // Sunucudan "bekle" sinyali gelirse
    socket.on('bekle', (mesaj) => {
        if (durumMesaji) {
            durumMesaji.innerText = mesaj;
        }
    });

    // Sunucudan "oyunBasliyor" sinyali gelirse
    socket.on('oyunBasliyor', (veri) => {
        if (durumMesaji) {

        }
        console.log("Eşleşme sağlandı! Rakip ID:", veri.rakip);
        
        // İlerleyen aşamada burada ses akışını bağlayacağımız WebRTC sinyalleşmesini çalıştıracağız.
    });
});
// Peer bağlantılarını tutacağımız sözlük
const peerBaglantilari = {};

// Tarayıcının ICE sunucu ayarları (Ücretsiz STUN sunucusu)
const rtcConfig = {
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
};

// Ses akışı sağlandıktan sonra eşleşen diğer oyuncularla WebRTC bağlantısı kurma
function sesBaglantilariniBaslat(rakipIdler, mevcutSocket) {
    if (!window.oyuncuSesAkisi) return;

    rakipIdler.forEach(hedefId => {
        if (hedefId === mevcutSocket.id) return;

        const peerConnection = new RTCPeerConnection(rtcConfig);
        peerBaglantilari[hedefId] = peerConnection;

        // Kendi ses akışımızı karşı tarafa ekleyelim
        window.oyuncuSesAkisi.getTracks().forEach(track => {
            peerConnection.addTrack(track, window.oyuncuSesAkisi);
        });

        // Karşı taraftan ses geldiğinde çalması için audio elementi oluştur
        peerConnection.ontrack = (event) => {
            let sesKutusu = document.getElementById(`ses-${hedefId}`);
            if (!sesKutusu) {
                sesKutusu = document.createElement('audio');
                sesKutusu.id = `ses-${hedefId}`;
                sesKutusu.autoplay = true;
                document.body.appendChild(sesKutusu);
            }
            sesKutusu.srcObject = event.streams[0];
        };

        // ICE adaylarını karşı tarafa gönder
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                mevcutSocket.emit('sesSinyali', {
                    hedefID: hedefId,
                    sinyal: { type: 'candidate', candidate: event.candidate }
                });
            }
        };

        // Bağlantıyı başlatan taraf bizsek Offer oluşturalım
        peerConnection.createOffer().then(offer => {
            return peerConnection.setLocalDescription(offer);
        }).then(() => {
            mevcutSocket.emit('sesSinyali', {
                hedefID: hedefId,
                sinyal: peerConnection.localDescription
            });
        });
    });
}
// Sunucudan gelen ses sinyallerini işleyen kısım
socket.on('sesSinyali', async (veri) => {
    const { gonderenID, sinyal } = veri;
    
    // Eğer bu kişiyle henüz bağlantı yoksa oluştur
    if (!peerBaglantilari[gonderenID]) {
        const peerConnection = new RTCPeerConnection(rtcConfig);
        peerBaglantilari[gonderenID] = peerConnection;

        // Kendi sesimizi ekle
        window.oyuncuSesAkisi.getTracks().forEach(track => {
            peerConnection.addTrack(track, window.oyuncuSesAkisi);
        });

        // Ses geldiğinde çal
        peerConnection.ontrack = (event) => {
            let sesKutusu = document.getElementById(`ses-${gonderenID}`);
            if (!sesKutusu) {
                sesKutusu = document.createElement('audio');
                sesKutusu.id = `ses-${gonderenID}`;
                sesKutusu.autoplay = true;
                document.body.appendChild(sesKutusu);
            }
            sesKutusu.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('sesSinyali', {
                    hedefID: gonderenID,
                    sinyal: { type: 'candidate', candidate: event.candidate }
                });
            }
        };
        peerBaglantilari[gonderenID] = peerConnection;
    }

    const peer = peerBaglantilari[gonderenID];

    // Gelen sinyali işle (Offer ise cevap dön, candidate ise ekle)
    if (sinyal.type === 'offer') {
        await peer.setRemoteDescription(new RTCSessionDescription(sinyal));
        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);
        socket.emit('sesSinyali', { hedefID: gonderenID, sinyal: peer.localDescription });
    } else if (sinyal.type === 'answer') {
        await peer.setRemoteDescription(new RTCSessionDescription(sinyal));
    } else if (sinyal.type === 'candidate') {
        await peer.addIceCandidate(new RTCIceCandidate(sinyal.candidate));
    }
});
